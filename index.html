<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;


const C = {
  bg: "#F9FAFB", panel: "#FFFFFF", surface: "#F3F4F6", surfaceLight: "#E9EBF0",
  accent: "#4F46E5", accentDim: "#4338CA", accentMuted: "rgba(79,70,229,0.08)",
  purple: "#4F46E5", purpleMuted: "rgba(79,70,229,0.08)",
  orange: "#f59e0b", orangeMuted: "rgba(245,158,11,0.12)",
  pink: "#ec4899", blue: "#3b82f6",
  text: "#1F2937", dim: "#6B7280", muted: "#9CA3AF",
  border: "#E5E7EB", borderLight: "#F3F4F6",
  white: "#fff", black: "#000", success: "#22c55e",
};
const FONT = "'Outfit','DM Sans',-apple-system,sans-serif";
const MONO = "'JetBrains Mono',monospace";

const GM_AVATAR = "🏛️";
const GM_NAME = "Grand Master";
const GM_HANDLE = "@PharosGrandMaster";

const DAILY_CHALLENGE = {
  question: "If every human had an AI agent managing their money, would banks still exist in 2035?",
  reward: "Top 10 answers split 200 $PROS",
  timeLeft: "4h 23m left",
  replies: 147,
  theme: "Daily Riddle #12",
};

const SAMPLE_CONVERSATIONS = [
  {
    user: { name: "cryptoNomad", handle: "@cryptoNomad_", avatar: "🧭" },
    msg: "I've been building on Pharos testnet since May. Every DApp, every swap, every governance vote. I'm not here for a quick flip — I want to be part of the RWA revolution.",
    gmReply: "847 testnet transactions. 12 governance votes. You walk the walk. Here's 35 $PROS. Don't make me regret it.",
    reward: 35, score: 91,
  },
  {
    user: { name: "web3sarah", handle: "@web3sarah_eth", avatar: "✨" },
    msg: "I deserve $PROS because... I really want it? Please? 🥺",
    gmReply: "\"I really want it\" is not a thesis. Come back when you have one. Next.",
    reward: 0, score: 12, roast: true,
  },
  {
    user: { name: "defi_architect", handle: "@defi_architect", avatar: "🏗️" },
    msg: "Banks won't disappear. They'll become middleware — invisible infrastructure that AI agents interact with on behalf of humans. The question isn't banks vs crypto. It's who owns the agent.",
    gmReply: "THIS is why I exist. The ownership question is the real question. 50 $PROS. Best answer today so far.",
    reward: 50, score: 97,
  },
];

const LEADERBOARD = [
  { rank: 1, addr: "0x7a3f...e82d", points: 847, narrative: "Full sweep + 5 referrals. The one to beat.", path: "Dual" },
  { rank: 2, addr: "0xb91c...4f2a", points: 723, narrative: "Quiet but deadly. Never missed a day.", path: "Action" },
  { rank: 3, addr: "0x2d8e...9c1b", points: 691, narrative: "Earned a surprise bonus at 4AM.", path: "Action" },
  { rank: 4, addr: "0xf4c1...3a7e", points: 584, narrative: "Convinced the Master 3 times this week.", path: "Convince" },
  { rank: 5, addr: "0x91ab...2f8c", points: 512, narrative: "Rising star. Joined 2 days ago, already top 5.", path: "Dual" },
];

const WEIGHT_DATA = [
  { task: "Referral", weight: "3x", icon: "👥", hot: true },
  { task: "Daily Prediction", weight: "2x", icon: "🎯", hot: false },
  { task: "Swap", weight: "1.5x", icon: "🔄", hot: false },
  { task: "Check-in", weight: "1x", icon: "✅", hot: false },
  { task: "LP Provision", weight: "2x", icon: "💧", hot: false },
];

const STYLES = `
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}body{background:${C.bg}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes typing{0%{width:0}100%{width:100%}}
@keyframes blink{0%,100%{border-color:${C.accent}}50%{border-color:transparent}}
@keyframes countDown{from{opacity:1}to{opacity:.6}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(79,70,229,.08)}50%{box-shadow:0 0 35px rgba(79,70,229,.16)}}
`;

function PoolCounter({ remaining }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
      <div style={{ width: "6px", height: "6px", borderRadius: "50%", background: C.success, animation: "pulse 1.5s infinite" }} />
      <span style={{ fontSize: "11px", color: C.dim, fontFamily: MONO }}>Pool: </span>
      <span style={{ fontSize: "13px", color: C.accent, fontWeight: 700, fontFamily: MONO }}>${remaining.toLocaleString()}</span>
      <span style={{ fontSize: "11px", color: C.dim }}> remaining</span>
    </div>
  );
}

function TweetCard({ conv, delay = 0 }) {
  const isRoast = conv.roast;
  return (
    <div style={{
      background: C.surface, borderRadius: "16px", padding: "20px",
      border: `1px solid ${isRoast ? C.pink + "30" : conv.reward > 30 ? C.accent + "30" : C.border}`,
      animation: `fadeUp .5s ease ${delay}s both`,
    }}>
      {/* User tweet */}
      <div style={{ display: "flex", gap: "12px", marginBottom: "16px" }}>
        <div style={{ width: "40px", height: "40px", borderRadius: "50%", background: C.surfaceLight, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "20px", flexShrink: 0 }}>{conv.user.avatar}</div>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: "4px" }}>
            <span style={{ fontSize: "13px", fontWeight: 700, color: C.text }}>{conv.user.name}</span>
            <span style={{ fontSize: "12px", color: C.muted }}>{conv.user.handle}</span>
          </div>
          <p style={{ fontSize: "13px", color: C.text, lineHeight: 1.6, margin: 0 }}>{conv.msg}</p>
        </div>
      </div>

      {/* GM reply */}
      <div style={{
        marginLeft: "20px", padding: "16px", borderRadius: "12px",
        background: isRoast ? `${C.pink}08` : `${C.accent}08`,
        borderLeft: `3px solid ${isRoast ? C.pink : C.accent}`,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px" }}>
          <div style={{ width: "28px", height: "28px", borderRadius: "50%", background: `linear-gradient(135deg,${C.accent}30,${C.purple}30)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "14px" }}>{GM_AVATAR}</div>
          <span style={{ fontSize: "12px", fontWeight: 700, color: C.accent }}>{GM_NAME}</span>
          <span style={{ fontSize: "11px", color: C.muted }}>{GM_HANDLE}</span>
        </div>
        <p style={{ fontSize: "13px", color: isRoast ? C.pink : C.text, lineHeight: 1.6, margin: 0, fontStyle: isRoast ? "normal" : "normal" }}>{conv.gmReply}</p>
        {conv.reward > 0 && (
          <div style={{ display: "inline-flex", alignItems: "center", gap: "6px", marginTop: "10px", padding: "4px 12px", borderRadius: "20px", background: C.accentMuted, border: `1px solid ${C.accent}30` }}>
            <span style={{ fontSize: "11px", color: C.accent, fontWeight: 700 }}>💰 {conv.reward} $PROS sent</span>
          </div>
        )}
        {isRoast && (
          <div style={{ display: "inline-flex", alignItems: "center", gap: "6px", marginTop: "10px", padding: "4px 12px", borderRadius: "20px", background: `${C.pink}15`, border: `1px solid ${C.pink}30` }}>
            <span style={{ fontSize: "11px", color: C.pink, fontWeight: 600 }}>🔥 Roasted — 0 $PROS</span>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [modal, setModal] = useState(null); // null | "convince" | "leaderboard"
  const [poolRemaining, setPoolRemaining] = useState(38420);
  const [userInput, setUserInput] = useState("");
  const [chatHistory, setChatHistory] = useState([]);
  const [isTyping, setIsTyping] = useState(false);
  const [tab, setTab] = useState("feed"); // "feed" | "challenge" | "myScore"
  const chatEndRef = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setPoolRemaining(p => Math.max(p - Math.floor(Math.random() * 3), 30000)), 8000);
    return () => clearInterval(t);
  }, []);

  const handleSendMessage = () => {
    if (!userInput.trim() || isTyping) return;
    const msg = userInput.trim();
    setChatHistory(prev => [...prev, { role: "user", text: msg }]);
    setUserInput("");
    setIsTyping(true);

    setTimeout(() => {
      const responses = [
        { text: "Interesting pitch. But I've heard similar words from 200 people today. What makes YOU different? Give me specifics — what have you actually done on Pharos?", reward: 0 },
        { text: "I checked your wallet. 23 testnet transactions, 2 governance votes. That's more than most. But I need to see consistency, not a one-week sprint. Come back after 7 consecutive days and I'll have something for you.", reward: 0 },
        { text: "Now THAT caught my attention. Your understanding of the RWA thesis is sharper than 90% of what I see. Here's 18 $PROS. Keep building, and there's more where that came from.", reward: 18 },
        { text: "Let me be direct — copying someone else's pitch and adding emojis doesn't impress me. I've seen this exact message 4 times today. Original thoughts only.", reward: 0 },
        { text: "Bold take. I don't fully agree, but you argued it well and backed it with data. That's rare. 25 $PROS for intellectual honesty.", reward: 25 },
      ];
      const r = responses[Math.floor(Math.random() * responses.length)];
      setChatHistory(prev => [...prev, { role: "gm", text: r.text, reward: r.reward }]);
      if (r.reward > 0) setPoolRemaining(p => p - r.reward);
      setIsTyping(false);
    }, 2000 + Math.random() * 1500);
  };

  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [chatHistory, isTyping]);

  const renderConvinceModal = () => (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,.75)", backdropFilter: "blur(8px)", display: "flex", alignItems: "center", justifyContent: "center", animation: "overlayIn .3s" }}>
      <div style={{ width: 720, maxHeight: "90vh", background: C.panel, borderRadius: "20px", border: `1px solid ${C.border}`, boxShadow: "0 8px 32px rgba(0,0,0,.12)", animation: "modalIn .4s ease", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {/* Header */}
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
            <div style={{ width: "44px", height: "44px", borderRadius: "50%", background: `linear-gradient(135deg,${C.accent}25,${C.purple}25)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "22px", border: `2px solid ${C.accent}30` }}>{GM_AVATAR}</div>
            <div>
              <div style={{ fontSize: "16px", fontWeight: 700, color: C.text }}>{GM_NAME}</div>
              <div style={{ fontSize: "11px", color: C.dim }}>{GM_HANDLE} · AI Airdrop Judge</div>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "16px" }}>
            <PoolCounter remaining={poolRemaining} />
            <button onClick={() => { setModal(null); setChatHistory([]); }} style={{ width: "32px", height: "32px", borderRadius: "50%", background: C.surface, border: `1px solid ${C.border}`, cursor: "pointer", color: C.dim, fontSize: "16px", display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", borderBottom: `1px solid ${C.border}`, flexShrink: 0 }}>
          {[
            { id: "feed", label: "Live Feed" },
            { id: "challenge", label: `Today's Challenge` },
            { id: "myScore", label: "Try It Yourself" },
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              flex: 1, padding: "10px 12px", fontSize: "13px", fontWeight: tab === t.id ? 700 : 500,
              color: tab === t.id ? "#fff" : C.dim,
              background: tab === t.id ? C.accent : "transparent",
              border: "none", borderBottom: "2px solid transparent",
              cursor: "pointer", fontFamily: FONT, transition: "all .2s",
            }}>{t.label}</button>
          ))}
        </div>

        {/* Content */}
        <div style={{ flex: 1, overflow: "auto", padding: "20px 24px" }}>
          {tab === "feed" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
              <div style={{ fontSize: "12px", color: C.dim, marginBottom: "4px" }}>Recent interactions — all public on 𝕏</div>
              {SAMPLE_CONVERSATIONS.map((conv, i) => <TweetCard key={i} conv={conv} delay={i * 0.15} />)}
            </div>
          )}

          {tab === "challenge" && (
            <div style={{ animation: "fadeUp .4s ease" }}>
              <div style={{
                background: `linear-gradient(135deg,${C.purpleMuted},${C.accentMuted})`,
                borderRadius: "16px", padding: "24px", border: `1px solid ${C.purple}25`, marginBottom: "20px",
              }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "16px" }}>
                  <span style={{ fontSize: "11px", color: C.purple, fontWeight: 600, letterSpacing: "1px", textTransform: "uppercase" }}>{DAILY_CHALLENGE.theme}</span>
                  <span style={{ fontSize: "11px", color: C.orange, fontWeight: 600 }}>⏳ {DAILY_CHALLENGE.timeLeft}</span>
                </div>
                <p style={{ fontSize: "18px", fontWeight: 700, color: C.text, lineHeight: 1.5, margin: "0 0 16px" }}>"{DAILY_CHALLENGE.question}"</p>
                <div style={{ display: "flex", gap: "16px" }}>
                  <span style={{ fontSize: "12px", color: C.accent }}>🏆 {DAILY_CHALLENGE.reward}</span>
                  <span style={{ fontSize: "12px", color: C.dim }}>💬 {DAILY_CHALLENGE.replies} replies</span>
                </div>
              </div>

              <div style={{ padding: "16px", background: C.surface, borderRadius: "12px", border: `1px solid ${C.border}` }}>
                <div style={{ fontSize: "12px", color: C.dim, marginBottom: "8px" }}>Grand Master's note:</div>
                <p style={{ fontSize: "13px", color: C.text, lineHeight: 1.6, margin: 0, fontStyle: "italic" }}>
                  "I've read 147 replies so far. Most people say 'no banks will die.' Boring. I want the answer that makes me think differently. Surprise me."
                </p>
              </div>
            </div>
          )}

          {tab === "myScore" && (
            <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
              {/* Chat area */}
              <div style={{ flex: 1, marginBottom: "16px" }}>
                {chatHistory.length === 0 && (
                  <div style={{ textAlign: "center", padding: "40px 20px", animation: "fadeIn .5s" }}>
                    <div style={{ fontSize: "40px", marginBottom: "12px" }}>{GM_AVATAR}</div>
                    <div style={{ fontSize: "16px", fontWeight: 700, color: C.text, marginBottom: "8px" }}>Convince the Grand Master</div>
                    <div style={{ fontSize: "13px", color: C.dim, lineHeight: 1.6, maxWidth: "400px", margin: "0 auto" }}>
                      Tell me why you deserve extra $PROS. I'll check your wallet, verify your claims, and judge your conviction. No templates. No BS.
                    </div>
                    <div style={{ display: "flex", gap: "8px", justifyContent: "center", marginTop: "20px", flexWrap: "wrap" }}>
                      {["Why I believe in Pharos", "My testnet contributions", "Challenge: AI vs banks"].map((prompt, i) => (
                        <button key={i} onClick={() => setUserInput(prompt === "Why I believe in Pharos" ? "I believe Pharos will become the leading RWA chain because..." : prompt === "My testnet contributions" ? "I've been on the testnet for 3 months, here's what I've done..." : "I think AI will fundamentally change banking because...")} style={{
                          padding: "8px 14px", background: C.surface, border: `1px solid ${C.border}`,
                          borderRadius: "20px", cursor: "pointer", color: C.dim, fontSize: "11px",
                          fontFamily: FONT, transition: "all .2s",
                        }}>{prompt}</button>
                      ))}
                    </div>
                  </div>
                )}

                {chatHistory.map((msg, i) => (
                  <div key={i} style={{
                    display: "flex", gap: "10px", marginBottom: "14px",
                    animation: `slideIn .3s ease`,
                    flexDirection: msg.role === "user" ? "row-reverse" : "row",
                  }}>
                    <div style={{
                      width: "32px", height: "32px", borderRadius: "50%", flexShrink: 0,
                      background: msg.role === "user" ? `linear-gradient(135deg,${C.purple},${C.accent})` : `linear-gradient(135deg,${C.accent}25,${C.purple}25)`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: msg.role === "user" ? "14px" : "16px",
                      border: msg.role === "gm" ? `2px solid ${C.accent}30` : "none",
                    }}>{msg.role === "user" ? "👤" : GM_AVATAR}</div>
                    <div style={{
                      maxWidth: "80%", padding: "12px 16px", borderRadius: "14px",
                      background: msg.role === "user" ? C.purple + "20" : C.surface,
                      border: `1px solid ${msg.role === "user" ? C.purple + "30" : C.border}`,
                    }}>
                      <p style={{ fontSize: "13px", color: C.text, lineHeight: 1.6, margin: 0 }}>{msg.text}</p>
                      {msg.reward > 0 && (
                        <div style={{ display: "inline-flex", alignItems: "center", gap: "4px", marginTop: "8px", padding: "3px 10px", borderRadius: "12px", background: C.accentMuted }}>
                          <span style={{ fontSize: "11px", color: C.accent, fontWeight: 700 }}>💰 {msg.reward} $PROS awarded</span>
                        </div>
                      )}
                    </div>
                  </div>
                ))}

                {isTyping && (
                  <div style={{ display: "flex", gap: "10px", animation: "fadeIn .3s" }}>
                    <div style={{ width: "32px", height: "32px", borderRadius: "50%", background: `linear-gradient(135deg,${C.accent}25,${C.purple}25)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "16px", border: `2px solid ${C.accent}30` }}>{GM_AVATAR}</div>
                    <div style={{ padding: "12px 16px", background: C.surface, borderRadius: "14px", border: `1px solid ${C.border}` }}>
                      <div style={{ display: "flex", gap: "4px" }}>
                        {[0, 1, 2].map(i => <div key={i} style={{ width: "6px", height: "6px", borderRadius: "50%", background: C.accent, animation: `pulse 1s ease infinite`, animationDelay: `${i * 0.2}s` }} />)}
                      </div>
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>
            </div>
          )}
        </div>

        {/* Input (only for myScore tab) */}
        {tab === "myScore" && (
          <div style={{ padding: "16px 24px", borderTop: `1px solid ${C.border}`, flexShrink: 0 }}>
            <div style={{ display: "flex", gap: "10px" }}>
              <input
                value={userInput}
                onChange={e => setUserInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleSendMessage()}
                placeholder="Make your case to the Grand Master..."
                style={{
                  flex: 1, padding: "12px 16px", background: C.surface, border: `1px solid ${C.border}`,
                  borderRadius: "12px", color: C.text, fontSize: "13px", fontFamily: FONT,
                  outline: "none",
                }}
              />
              <button onClick={handleSendMessage} disabled={isTyping || !userInput.trim()} style={{
                padding: "12px 20px", background: isTyping || !userInput.trim() ? C.surface : `linear-gradient(135deg,${C.accent},${C.accentDim})`,
                border: "none", borderRadius: "12px", cursor: isTyping ? "wait" : "pointer",
                color: isTyping || !userInput.trim() ? C.muted : "#fff", fontSize: "13px", fontWeight: 700, fontFamily: FONT,
              }}>Send</button>
            </div>
            <div style={{ fontSize: "10px", color: C.muted, marginTop: "6px" }}>
              ⚠️ Prototype demo — real version runs on 𝕏 as public replies to {GM_HANDLE}
            </div>
          </div>
        )}
      </div>
    </div>
  );

  const renderLeaderboardModal = () => (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,.75)", backdropFilter: "blur(8px)", display: "flex", alignItems: "center", justifyContent: "center", animation: "overlayIn .3s" }}>
      <div style={{ width: 640, maxHeight: "85vh", background: C.panel, borderRadius: "20px", border: `1px solid ${C.border}`, boxShadow: "0 8px 32px rgba(0,0,0,.12)", animation: "modalIn .4s ease", overflow: "hidden" }}>
        {/* Header */}
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: "18px", fontWeight: 700, color: C.text }}>Action Leaderboard</div>
            <div style={{ fontSize: "11px", color: C.dim, marginTop: "2px" }}>Narrated by the Grand Master</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
            <PoolCounter remaining={poolRemaining} />
            <button onClick={() => setModal(null)} style={{ width: "32px", height: "32px", borderRadius: "50%", background: C.surface, border: `1px solid ${C.border}`, cursor: "pointer", color: C.dim, fontSize: "16px", display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
          </div>
        </div>

        {/* Weight strip */}
        <div style={{ padding: "14px 24px", background: C.surface, borderBottom: `1px solid ${C.border}` }}>
